function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }

  const v = i => { const x = Number(ans[i]); return rev.includes(i) ? (max + 1 - x) : x; };

function toMin(t) { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }

  const c1 = Number(a.q6);

function localApi(req) {
  const db = store.get("abpsy12.local") || { users: {} };
  const save = () => store.set("abpsy12.local", db);
  const pack = u => ({ ok: true, profile: { id: u.id, name: u.name, start: u.start }, logs: u.logs, tests: u.tests, reflection: u.reflection });
  if (req.action === "admin") return { ok: true, students: Object.values(db.users).map(u => ({ id: u.id, name: u.name, start: u.start, logs: u.logs, tests: u.tests, reflection: u.reflection })) };
  if (req.action === "signup") {
    if (db.users[req.id]) throw new Error("이미 있는 아이디입니다.");
    db.users[req.id] = { id: req.id, name: req.name, key: req.key, start: today(), logs: {}, tests: {}, reflection: null }; save();
    return pack(db.users[req.id]);
  }
  const u = db.users[req.id];
  if (!u || u.key !== req.key) throw new Error("아이디 또는 비밀번호가 맞지 않습니다.");
  if (req.action === "saveLog") u.logs[req.date] = req.data;
  else if (req.action === "saveTest") u.tests[req.test] = req.data;
  else if (req.action === "saveReflection") u.reflection = req.data;

}

function collectTest(k, f) {

function sleepChart(w) {

  const max = Math.max(10, Math.ceil(Math.max(...vals.map(v => v || 0)) + 1));

  let g = "";
  for (let t = 0; t <= max; t += 2) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#E3E7EA"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="#6B7680">${t}</text>`;
  w.days.forEach((d, i) => {
    const x = L + i * bw + bw * 0.2, v = vals[i];

      const top = y(v), h = T + ph - top;
      g += `<path d="M${x},${T + ph} V${top + 4} q0,-4 4,-4 H${x + bw * 0.6 - 4} q4,0 4,4 V${T + ph} Z" fill="#3E8E86" data-tip="${md(d.date)} (${dow(d.date)}) 잠잔 시간 ${fmtH(w.sl[i].tst)}, 수면효율 ${r1(w.sl[i].se)}%"></path><text x="${x + bw * 0.3}" y="${top - 6}" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1F23">${r1(v)}</text>`;
      if (h < 1) g += "";
    } else g += `<text x="${x + bw * 0.3}" y="${T + ph - 8}" text-anchor="middle" font-size="12" fill="#6B7680">기록 없음</text>`;
    g += `<text x="${x + bw * 0.3}" y="${H - 24}" text-anchor="middle" font-size="12" fill="#4A5560">${md(d.date)}</text><text x="${x + bw * 0.3}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#6B7680">${dow(d.date)}</text>`;
  });

  return `<div class="scroll"><table><tr><th>날짜</th><th>취침</th><th>기상</th><th>잠들기까지</th><th>잠잔 시간</th><th>수면효율</th><th>수면의 질</th><th>낮 졸림</th><th>식사</th><th>식사 시각</th><th>스트레스</th></tr>` +
    w.days.map((d, i) => { const s = (d.log && d.log.sleep) || {}, st = w.sl[i], ms = (d.log && d.log.meals) || [], dd = (d.log && d.log.day) || {};
      return `<tr><td>${md(d.date)} (${dow(d.date)})</td><td>${esc(s.bed || "-")}</td><td>${esc(s.wake || "-")}</td><td class="n">${s.sol === "" || s.sol === undefined ? "-" : esc(s.sol) + "분"}</td><td class="n">${st.tst === null || st.tst === undefined ? "-" : r1(st.tst / 60) + "시간"}</td><td class="n">${st.se === null || st.se === undefined ? "-" : Math.round(st.se) + "%"}</td><td class="n">${esc(s.quality || "-")}</td><td class="n">${esc(s.sleepy || "-")}</td><td class="n">${ms.length}회</td><td>${esc(ms.map(m => m.time).filter(Boolean).join(", ") || "-")}</td><td class="n">${dd.stress === "" || dd.stress === undefined ? "-" : esc(dd.stress)}</td></tr>`; }).join("") + `</table></div>`;
}
function tiles(w) {
  const t = (k, v, u) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}<span class="u"> ${u || ""}</span></div></div>`;
  return `<div class="tiles">${t("기록한 날", w.logged, "/ 7일")}${t("평균 잠잔 시간", w.tst === null ? "-" : r1(w.tst / 60), "시간")}${t("평균 수면효율", w.se === null ? "-" : Math.round(w.se), "%")}${t("잠들기까지", w.sol === null ? "-" : Math.round(w.sol), "분")}${t("하루 식사 횟수", r1(w.mealsPerDay), "회")}${t("혼자 먹은 비율", w.alone === null ? "-" : Math.round(w.alone), "%")}${t("밤 10시 이후 식사", w.late, "회")}${t("먹기 전 배고픔", r1(w.hunger), "/ 10")}</div>`;
}
function viewWeek() {
  const w = weekSummary(S.logs, S.profile.start);
  return `<div class="band">나의 일주일 (${md(w.days[0].date)} ~ ${md(w.days[6].date)})</div>
  ${tiles(w)}
  <div class="band">날짜별 잠잔 시간 (시간)</div>${sleepChart(w)}
  <div class="band">식사 시각</div><p class="note">점 하나가 식사 한 번입니다. 가로축은 새벽 4시부터 다음 날 새벽 4시까지입니다.</p>${mealChart(w)}
  <div class="band">먹기 전 기분</div>
  ${w.moods.length ? `<p>${w.moods.map(([m, n]) => `${esc(m)} ${n}회`).join(" · ")}</p>` : `<p class="note">아직 기록이 없습니다.</p>`}
  <div class="band">기록 표</div>${weekTable(w)}
  <div class="band">살펴볼 질문</div>
  <p class="note">취침과 기상 시각이 날마다 얼마나 다른가요? 잠을 못 잔 날의 전날에는 무엇이 달랐나요? 배고프지 않은데 먹은 때는 어떤 기분이었나요? 식사 간격이 길었던 날 다음 식사는 어땠나요? 수면과 섭식이 서로 영향을 준 날이 있었나요?</p>`;
}

/* ---- 한 장 정리 ---- */
const REF_FIELDS = [
  ["eat", "나의 섭식 패턴", "일주일 기록과 검사 결과에서 알아차린 섭식 패턴을 씁니다. (식사 시각과 규칙성, 배고픔과 포만의 신호, 혼자 먹을 때와 함께 먹을 때 등)"],
  ["sleep", "나의 수면 패턴", "일주일 기록과 검사 결과에서 알아차린 수면 패턴을 씁니다. (취침과 기상의 규칙성, 잠들기까지 걸리는 시간, 수면효율, 낮의 졸림 등)"],
  ["factors", "영향을 주는 상황과 감정", "어떤 상황과 감정이 섭식과 수면에 영향을 주었나요? 수업에서 배운 개념(내적 신호의 인식, 식이 제한과 폭식의 순환, 소인·유발·지속 요인, 조건화된 각성 등)으로 설명해 봅니다."],
  ["methods", "건강한 습관을 기르기 위한 방법 탐색", "나에게 맞을 것 같은 방법을 찾아 씁니다. 수업 내용(수면위생, 자극조절 등)이나 스스로 찾아본 자료를 근거로 듭니다."],
  ["keep", "유지하고 싶은 점", "지금 잘하고 있어서 계속하고 싶은 한 가지"],
  ["change", "바꾸고 싶은 점과 계획", "한두 가지를 정해 언제, 어디서, 무엇을 할지 구체적인 행동으로 씁니다."]
];
function viewSheet() {
  const w = weekSummary(S.logs, S.profile.start), r = S.reflection || {};
  const showScores = r.showScores !== false;
  const scoreRows = Object.keys(TESTS).map(k => `<tr><td>${TESTS[k].title}</td><td>${S.tests[k] ? esc(testSummary(k, S.tests[k])) + (k === "isi" ? " · " + esc(S.tests[k].score.label) : "") : "하지 않음"}</td></tr>`).join("");
  return `
  <form data-form="saveReflection" class="noprint">
    <div class="band">패턴 알아차리기와 앞으로의 계획</div>
    <p class="note">먼저 '나의 일주일'에서 기록을 살펴본 뒤 씁니다. 쓴 내용은 저장되며, 아래 '한 장 정리'에 바로 반영됩니다.</p>
    ${REF_FIELDS.map(([k, t, h]) => `<div style="margin-bottom:12px">${field(t, `<textarea name="${k}" maxlength="1500">${esc(r[k] || "")}</textarea>`, h)}</div>`).join("")}
    <p><label class="note"><input type="checkbox" name="showScores" ${showScores ? "checked" : ""}> 출력하는 한 장 정리에 검사 점수를 포함합니다</label></p>
    <div class="row"><button class="btn">저장</button><button type="button" class="btn ghost" data-act="print">인쇄 / PDF로 저장</button><span id="m-ref"></span></div>
    <p class="note" style="margin-top:8px">'인쇄 / PDF로 저장'을 누른 뒤 프린터 대신 'PDF로 저장'을 고르면 제출용 파일이 만들어집니다.</p>
  </form>
  <div class="band noprint">한 장 정리 미리보기</div>
  <div class="sheet">
    <h2>나의 섭식과 수면 돌아보기</h2>
    <div class="note">이상심리학 12주차 개인과제 · ${esc(S.profile.name)} (${esc(S.profile.id)}) · 기록 기간 ${w.days[0].date} ~ ${w.days[6].date} · 기록한 날 ${w.logged}/7일</div>
    <h3>일주일 기록</h3>
    ${weekTable(w)}
    <p class="note" style="margin-top:6px">평균 잠잔 시간 ${w.tst === null ? "-" : r1(w.tst / 60) + "시간"} · 평균 수면효율 ${w.se === null ? "-" : Math.round(w.se) + "%"} · 잠들기까지 ${w.sol === null ? "-" : Math.round(w.sol) + "분"} · 하루 식사 ${r1(w.mealsPerDay)}회 · 혼자 먹은 비율 ${w.alone === null ? "-" : Math.round(w.alone) + "%"} · 밤 10시 이후 식사 ${w.late}회${w.moods.length ? " · 먹기 전 기분: " + w.moods.slice(0, 3).map(([m, n]) => esc(m) + " " + n + "회").join(", ") : ""}</p>
    ${showScores ? `<h3>검사 결과</h3><table>${scoreRows}</table>` : ""}
    ${REF_FIELDS.map(([k, t]) => `<h3>${t}</h3><div class="txt">${esc(r[k] || "")}</div>`).join("")}
  </div>`;
}

/* ---- 교수용 ---- */
function viewAdmin() {
  if (!S.admin) return `<div class="band">교수용 화면</div>
    <form data-form="adminLogin"><div class="grid" style="max-width:340px;grid-template-columns:1fr">${LOCAL ? `<p class="note">연습 모드에서는 이 기기에 저장된 계정만 보입니다.</p>` : field("교수용 비밀번호", inp("adminKey", "password", "", "required"))}
    <div class="row"><button class="btn">전체 기록 보기</button><span id="m-admin" class="err"></span></div></div></form>`;
  const rows = S.admin.map((st, i) => {
    const w = weekSummary(st.logs || {}, st.start || today()), t = st.tests || {}, r = st.reflection || {};
    const done = REF_FIELDS.filter(([k]) => (r[k] || "").trim()).length;
    return `<tr><td>${esc(st.name)}<br><span class="note">${esc(st.id)}</span></td><td class="n">${w.logged}/7</td><td class="n">${w.tst === null ? "-" : r1(w.tst / 60)}</td><td class="n">${w.se === null ? "-" : Math.round(w.se) + "%"}</td><td class="n">${r1(w.mealsPerDay)}</td>
      <td class="n">${t.obcs ? t.obcs.score.groups.map(g => r1(g.mean)).join(" / ") : "-"}</td><td class="n">${t.eat ? t.eat.score.total : "-"}</td><td class="n">${t.isi ? t.isi.score.total : "-"}</td><td class="n">${t.psqi && t.psqi.score.total !== null ? t.psqi.score.total : "-"}</td>
      <td class="n">${done}/${REF_FIELDS.length}</td><td><button class="btn ghost small" data-act="adminOpen" data-i="${i}">보기</button></td></tr>`;
  }).join("");
  let detail = "";
  if (S.adminOpen !== undefined && S.admin[S.adminOpen]) {
    const st = S.admin[S.adminOpen], w = weekSummary(st.logs || {}, st.start || today()), r = st.reflection || {};
    detail = `<div class="band">${esc(st.name)} (${esc(st.id)})</div>${weekTable(w)}
      <h3 style="font-size:15px;margin:12px 0 6px">검사</h3><table>${Object.keys(TESTS).map(k => `<tr><td>${TESTS[k].title}</td><td>${(st.tests || {})[k] ? esc(testSummary(k, st.tests[k])) : "하지 않음"}</td></tr>`).join("")}</table>
      <div class="sheet">${REF_FIELDS.map(([k, t]) => `<h3>${t}</h3><div class="txt">${esc(r[k] || "")}</div>`).join("")}</div>
      ${w.days.filter(d => d.log && d.log.day && d.log.day.note).map(d => `<p class="note"><b>${md(d.date)} 메모</b> ${esc(d.log.day.note)}</p>`).join("")}`;
  }
  return `<div class="band">전체 기록 (${S.admin.length}명)</div>
    <p class="note">섭식 관련 점수를 포함한 민감한 정보입니다. 화면을 다른 사람과 공유하지 않도록 주의해 주세요.</p>
    <div class="scroll"><table><tr><th>학생</th><th>기록</th><th>평균 수면(시간)</th><th>수면효율</th><th>식사/일</th><th>신체 감시 / 수치심</th><th>섭식 태도</th><th>ISI</th><th>PSQI</th><th>정리</th><th></th></tr>${rows || `<tr><td colspan="11">아직 가입한 학생이 없습니다.</td></tr>`}</table></div>${detail}`;
}

/* ---- 동작 ---- */
async function act(name, el) {
  if (S.busy) return;
  try {
    if (name === "login" || name === "signup") {
      const o = formData(el), mid = "m-" + name;
      if (!/^[A-Za-z0-9_\-가-힣]{2,20}$/.test(o.id)) return msg(mid, "아이디는 한글, 영문, 숫자 2~20자로 정해 주세요.");
      if (name === "signup" && o.pw.length < 4) return msg(mid, "비밀번호는 4자 이상으로 정해 주세요.");
      S.busy = true; msg(mid, "확인하는 중입니다.", true);
      const key = await sha256hex("abpsy12|" + o.id + "|" + o.pw);
      const res = await api(name, { id: o.id, key, name: o.name, code: o.code });
      adopt(res, key); S.view = "home";
      const sess = { id: o.id, key }; try { sessionStorage.setItem("abpsy12.session", JSON.stringify(sess)); } catch (e) {}
      if (name === "signup" || o.keep) store.set("abpsy12.session", sess);
      S.busy = false; return render();
    }
    if (name === "logout") { try { sessionStorage.removeItem("abpsy12.session"); } catch (e) {} store.del("abpsy12.session"); S.profile = null; S.key = null; S.logs = {}; S.tests = {}; S.reflection = {}; return render(); }
    if (name === "openDay") { S.date = el.dataset.date; S.view = "log"; return render(); }
    if (name === "shiftDay") { S.date = addDays(S.date, Number(el.dataset.n)); return render(); }
    if (name === "setStart") { const v = $("#start").value; if (!v) return; S.busy = true; await api("setStart", { start: v }); S.profile.start = v; S.busy = false; return render(); }
    if (name === "addMeal") {
      const f = el.closest("form"), o = formData(f);
      if (!o.m_time) return msg("m-meal", "먹은 시각을 입력해 주세요.");
      const l = collectLog(f);
      l.meals.push({ time: o.m_time, type: o.m_type, who: o.m_who, hunger: o.m_hunger === "" ? "" : Number(o.m_hunger), full: o.m_full === "" ? "" : Number(o.m_full), moodBefore: o.m_before || [], moodAfter: o.m_after || [], note: o.m_note || "" });
      l.meals.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
      S.busy = true; msg("m-meal", "저장하는 중입니다.", true); const ok = await saveLog(l, "m-meal"); S.busy = false; if (ok) render(); return;
    }
    if (name === "delMeal") { const f = el.closest("form"), l = collectLog(f); l.meals.splice(Number(el.dataset.i), 1); S.busy = true; const ok = await saveLog(l, "m-log"); S.busy = false; if (ok) render(); return; }
    if (name === "saveLog") { const l = collectLog(el); S.busy = true; msg("m-log", "저장하는 중입니다.", true); const ok = await saveLog(l, "m-log"); S.busy = false; if (ok) { render(); msg("m-log", "저장했습니다.", true); } return; }
    if (name === "openTest") { S.test = el.dataset.test; S.view = "tests"; return render(); }
    if (name === "closeTest") { S.test = null; return render(); }
    if (name === "saveTest") {
      let data; try { data = collectTest(S.test, el); } catch (e) { return msg("m-test", e.message); }
      S.busy = true; msg("m-test", "저장하는 중입니다.", true);
      await api("saveTest", { test: S.test, data, summary: testSummary(S.test, data) }); S.tests[S.test] = data; S.busy = false; return render();
    }
    if (name === "saveReflection") {
      const o = formData(el); S.busy = true; msg("m-ref", "저장하는 중입니다.", true);
      await api("saveReflection", { data: o }); S.reflection = o; S.busy = false; render(); return msg("m-ref", "저장했습니다.", true);
    }
    if (name === "print") { try { window.print(); } catch (e) { msg("m-ref", "이 브라우저에서는 인쇄 창을 열 수 없습니다. 브라우저 메뉴의 인쇄를 사용해 주세요."); } return; }
    if (name === "admin") { S.view = "admin"; return render(); }
    if (name === "exitAdmin") { S.view = "home"; S.admin = null; S.adminOpen = undefined; return render(); }
    if (name === "adminLogin") { const o = formData(el); S.busy = true; msg("m-admin", "불러오는 중입니다.", true); const res = await api("admin", { adminKey: o.adminKey }); S.admin = res.students; S.busy = false; return render(); }
    if (name === "adminOpen") { S.adminOpen = Number(el.dataset.i); return render(); }
  } catch (e) {
    S.busy = false;
    const map = { login: "m-login", signup: "m-signup", saveTest: "m-test", saveReflection: "m-ref", adminLogin: "m-admin", setStart: "m-start" };
    if (map[name] && document.getElementById(map[name])) msg(map[name], e.message); else console.error(e);
  }
}

/* ---- 시작 ---- */
(async function init() {
  let sess = null;
  try { sess = JSON.parse(sessionStorage.getItem("abpsy12.session")); } catch (e) {}
  sess = sess || store.get("abpsy12.session");
  if (sess && sess.id && sess.key) {
    try { S.profile = { id: sess.id }; S.key = sess.key; const res = await api("login", {}); adopt(res, sess.key); }
    catch (e) { S.profile = null; S.key = null; }
  }
  render();
})();
})();
</script>
</body>
</html>
